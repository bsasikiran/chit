<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit — Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17352c;color:#17231f;font:15px/1.5 system-ui,sans-serif}.card{width:min(390px,calc(100% - 40px));background:#fff;border-radius:18px;padding:30px;box-shadow:0 18px 50px #0002}.logo{color:#2c735d;font-size:29px;font-weight:800}h1{font-size:30px;letter-spacing:-.04em;margin:18px 0 22px}label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #d8e0da;border-radius:10px;padding:12px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:20px;background:#2c735d;color:#fff;font:inherit;font-weight:700}.muted{color:#6d7873;font-size:13px;text-align:center;margin-top:16px}</style></head><body><main class="card"><div class="logo">chit</div><h1>Welcome back</h1><form><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" placeholder="Your password"><button type="submit">Sign in</button></form><div class="muted">New here? Create an account</div></main></body></html>
